name: Sync publications from Google Scholar

on:
  schedule:
    # Runs every Monday at 03:00 UTC (~8:30 AM IST).
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run publication sync
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/sync_publications.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "publication-sync-bot"
          git config user.email "actions@github.com"
          git add publication/ scripts/publications_seen.json
          git diff --cached --quiet || git commit -m "Auto-sync: new publications from Google Scholar"
          git push
